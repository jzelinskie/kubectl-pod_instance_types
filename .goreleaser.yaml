version: 2
project_name: kubectl-pod-instance-types

builds:
  - id: kubectl-pod-instance-types
    main: ./cmd/kubectl-pod-instance-types
    binary: kubectl-pod-instance-types
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: [-s -w]
    env: [CGO_ENABLED=0]
  - id: kubectl-pit
    main: ./cmd/kubectl-pod-instance-types
    binary: kubectl-pit
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: [-s -w]
    env: [CGO_ENABLED=0]

archives:
  - id: archive-full
    ids: [kubectl-pod-instance-types]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
  - id: archive-pit
    ids: [kubectl-pit]
    name_template: "kubectl-pit_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: jzelinskie
    name: pod-instances

krews:
  - name: pod-instance-types
    ids: [archive-full]
    repository:
      owner: jzelinskie
      name: pod-instances
    homepage: https://github.com/jzelinskie/pod-instances
    short_description: List pods with their node's cloud instance type
    description: |
      Lists pods in a namespace with an additional INSTANCE-TYPE column showing
      the underlying node's cloud instance type. Supports all standard kubectl
      output format flags (-o json, -o yaml, -o jsonpath, etc.).
    skip_upload: auto

  - name: pit
    ids: [archive-pit]
    repository:
      owner: jzelinskie
      name: pod-instances
    homepage: https://github.com/jzelinskie/pod-instances
    short_description: List pods with their node's cloud instance type
    description: |
      Lists pods in a namespace with an additional INSTANCE-TYPE column showing
      the underlying node's cloud instance type. Alias for kubectl pod-instance-types.
    skip_upload: auto
