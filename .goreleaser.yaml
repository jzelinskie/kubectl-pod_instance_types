version: 2
project_name: kubectl-pod-instance-types

before:
  hooks:
    - go mod tidy

builds:
  - id: kubectl-pod-instance-types
    main: ./cmd/kubectl-pod-instance-types
    binary: kubectl-pod-instance-types
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: [-s -w]
    env: [CGO_ENABLED=0]
  - id: kubectl-pit
    main: ./cmd/kubectl-pod-instance-types
    binary: kubectl-pit
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: [-s -w]
    env: [CGO_ENABLED=0]

archives:
  - id: archive
    ids: [kubectl-pod-instance-types, kubectl-pit]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

krews:
  - name: pod-instance-types
    repository:
      owner: jzelinskie
      name: pod-instances
    homepage: https://github.com/jzelinskie/pod-instances
    short_description: List pods with their node's cloud instance type
    description: |
      Lists pods in a namespace with an additional INSTANCE-TYPE column showing
      the underlying node's cloud instance type. Supports all standard kubectl
      output format flags (-o json, -o yaml, -o jsonpath, etc.).
    skip_upload: auto

  - name: pit
    repository:
      owner: jzelinskie
      name: pod-instances
    homepage: https://github.com/jzelinskie/pod-instances
    short_description: Alias for the pod-instance-types kubectl plugin
    description: |
      Alias for kubectl pod-instance-types. Lists pods with an INSTANCE-TYPE column.
    skip_upload: auto
